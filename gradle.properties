# Daemon do Gradle dimensionado para 4 CPUs / 15 GB de RAM (local e runner do GitHub Actions).
# Orçamento aproximado: daemon 4 GB + daemon do Kotlin 2 GB + JVM de testes (Robolectric) 2 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
# Estável no Gradle 9 e suportado por AGP 9, KSP, Hilt e Room.
org.gradle.configuration-cache=true

# AndroidX e classes R não transitivas (cada módulo só enxerga os próprios recursos).
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Dados de publicação usados na tela Sobre e na ficha da loja. Os valores abaixo são MARCADORES:
# troque antes do primeiro build de release (docs/PUBLICACAO.md).
meuSantinho.privacyPolicyUrl=https://example.com/meu-santinho/privacidade
meuSantinho.contactEmail=contato@example.com
